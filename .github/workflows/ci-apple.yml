# Apple builds (iOS + Mac Catalyst): DEFERRED TO PHASE 2 (owner decision, 2026-10-14).
# Manual trigger only, so it never blocks PRs. See docs/plan.md "Phase 2: Apple builds".
name: CI (Apple, manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  maui-apple:
    name: maui-apple
    # .NET for iOS 27.x (workload set 10.0.401.1+) needs Xcode 27, which GitHub runners do not ship yet.
    # Pin workload set 10.0.401 (iOS/Mac Catalyst 26.5.10318, which needs Xcode 26.6). Revisit when runners get Xcode 27.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-maccatalyst --version 10.0.401
      - name: Build web bundle for the app
        working-directory: web
        run: |
          npm ci
          npm run build:app
      - name: Build iOS (simulator, unsigned)
        run: dotnet build src/Lld.App -f net10.0-ios -p:SkipWebBuild=true -p:SkipAndroid=true
      - name: Build Mac Catalyst (unsigned)
        run: dotnet build src/Lld.App -f net10.0-maccatalyst -p:SkipWebBuild=true -p:SkipAndroid=true

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install Aspire CLI
        run: dotnet tool install -g Aspire.Cli --version 13.6.1
      - name: Unit tests
        run: dotnet test --project tests/Lld.Api.Tests
      - name: Aspire integration tests (API only)
        run: dotnet test --project tests/Lld.IntegrationTests

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint + design guardrails
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Playwright smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  maui-windows-android:
    name: maui-windows-android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Build web bundle for the app
        working-directory: web
        run: |
          npm ci
          npm run build:app
      - name: Build Windows
        run: dotnet build src/Lld.App -f net10.0-windows10.0.19041.0 -p:SkipWebBuild=true
      - name: Build Android
        run: dotnet build src/Lld.App -f net10.0-android -p:SkipWebBuild=true
